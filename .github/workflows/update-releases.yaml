name: Update releases

on:
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.14.1

jobs:
  update:
    name: Update releases
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token to read the organization releases
        id: generate_read_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Generate GitHub App token to push the releases data
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Update releases
        run: pnpm update-releases
        env:
          GITHUB_TOKEN: ${{ steps.generate_read_token.outputs.token }}

      - name: Commit updated releases
        env:
          APP_SLUG: ${{ steps.generate_token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          if git diff --quiet -- src/data/releases.json; then
            echo "No new releases."
            exit 0
          fi

          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add src/data/releases.json
          git commit -m "[bot] data: update releases"
          git push
